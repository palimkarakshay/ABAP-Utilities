name: clean-core-readiness

# ABAP Cloud / Clean Core readiness gate (abap-mcp, offline): fails when the count of cloud blockers or
# non-released API uses grows beyond docs/readiness-baseline.json, and checks that the generated
# matrix docs/clean-core-readiness.generated.md is committed and current.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run readiness
      - name: Generated matrix must be committed
        run: git diff --exit-code -- docs/clean-core-readiness.generated.md || (echo "::error::run 'npm run readiness' and commit docs/clean-core-readiness.generated.md" && exit 1)
