name: unit-tests

# ABAP Unit without an SAP system: the pure modules listed in abap_transpile.json are
# transpiled to JavaScript (@abaplint/transpiler) and executed on the open-abap kernel.
# Scope: pure logic only (no DB, no RAP/EML, no SAP framework classes). Modules that depend
# on BAL, BCS, RTTS-heavy or GUI APIs stay SAP-only and are verified in ADT / abapGit.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  abap-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Transpile pure modules and run their ABAP Unit tests
        run: npm test
